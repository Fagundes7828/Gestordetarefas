<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Entrar · MF Agenda</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><text y='.9em' font-size='70' x='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-weight='bold' font-family='system-ui'>MF</text></svg>">
</head>
<body>

  <!-- Fundo: orbes flutuantes desfocados (efeito iOS) -->
  <div class="bg">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>

  <main class="card">
    <div class="logo">
      <div class="logo-mark">MF</div>
      <h1>MF Agenda</h1>
      <p class="subtitle">Sua organização, na nuvem.</p>
    </div>

    <!-- Controle segmentado estilo iOS -->
    <div class="segment" role="tablist">
      <span class="segment-thumb" id="segThumb"></span>
      <button class="segment-btn active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="segment-btn" id="tabSignup" onclick="switchTab('signup')">Criar conta</button>
    </div>

    <!-- Mensagem de feedback (erros / sucesso) -->
    <div class="alert" id="alert"></div>

    <!-- ========== FORM LOGIN ========== -->
    <form class="form active" id="formLogin" autocomplete="on">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" placeholder="voce@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPass">Senha</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="button" class="btn btn-primary" id="btnLogin" onclick="doLogin()">Entrar</button>

      <div class="divider"><span>ou</span></div>

      <button type="button" class="btn btn-google" onclick="doGoogle()">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Entrar com Google
      </button>
    </form>

    <!-- ========== FORM CADASTRO ========== -->
    <form class="form" id="formSignup" autocomplete="on">
      <div class="field">
        <label for="signName">Nome completo</label>
        <input type="text" id="signName" placeholder="Seu nome" autocomplete="name">
      </div>
      <div class="field">
        <label for="signEmail">E-mail</label>
        <input type="email" id="signEmail" placeholder="voce@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="signPass">Senha</label>
        <input type="password" id="signPass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="signPass2">Confirmar senha</label>
        <input type="password" id="signPass2" placeholder="Repita a senha" autocomplete="new-password">
      </div>

      <button type="button" class="btn btn-primary" id="btnSignup" onclick="doSignup()">Criar conta</button>

      <div class="divider"><span>ou</span></div>

      <button type="button" class="btn btn-google" onclick="doGoogle()">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Cadastrar com Google
      </button>
    </form>
  </main>

  <!-- O type="module" é necessário para o Firebase moderno funcionar -->
  <script type="module" src="auth.js"></script>
</body>
</html>
